security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Connexion JSON de l'API — Lexik répond directement {"token": "..."}
        # sur POST /api/auth/login. Doit être déclaré AVANT le firewall "api"
        # ci-dessous puisque son pattern est un sous-ensemble de ^/api.
        api_login:
            pattern: ^/api/auth/login
            stateless: true
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Toutes les autres routes /api/* — authentification par JWT (Bearer token),
        # stateless (aucune session ni cookie), consommé par le frontend Next.js.
        api:
            pattern: ^/api
            stateless: true
            entry_point: jwt
            jwt: ~
            user_checker: App\Security\VerifiedUserChecker

        # Espace admin (Twig, session) — formulaire de connexion classique.
        admin:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\AppAuthenticator
            logout:
                path: admin_logout
                target: admin_login
            remember_me:
                secret: "%kernel.secret%"
                lifetime: 604800
                path: /admin

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    access_control:
        # --- API publique (lecture) ---
        - { path: ^/api/auth/(register|login), roles: PUBLIC_ACCESS }
        - { path: ^/api/products, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/categories, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/blog, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/orders/, roles: PUBLIC_ACCESS, methods: [GET] } # suivi par référence, sans compte
        - { path: ^/api/checkout, roles: PUBLIC_ACCESS, methods: [POST] } # commande invité autorisée
        - { path: ^/api/contact, roles: PUBLIC_ACCESS, methods: [POST] }
        # --- API authentifiée ---
        - { path: ^/api/account, roles: ROLE_USER }
        - { path: ^/api/me, roles: ROLE_USER }
        - { path: ^/api, roles: ROLE_USER } # filet de sécurité : tout endroit /api/* non listé ci-dessus exige une connexion
        # --- Webhook PAPI (server-to-server, jamais depuis le navigateur) ---
        - { path: ^/paiement/papi/notification, roles: PUBLIC_ACCESS }
        # --- Admin (Twig) ---
        - { path: ^/admin/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
